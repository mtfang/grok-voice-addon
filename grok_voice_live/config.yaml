# No `image:` key -> Supervisor builds this add-on locally from the Dockerfile.
name: Grok Voice Live
version: "0.4.4"
slug: grok_voice_live
description: Live speech-to-speech Grok (xAI realtime) bridge for Satellite1 devices, with Home Assistant MCP tools
url: https://github.com/mtfang/grok-voice-addon
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
map:
  - share:rw
ports:
  10700/tcp: 10700
ports_description:
  10700/tcp: Grok live stream (Satellite1 grok_stream component)
options:
  xai_api_key: ""
  ha_token: ""
  ha_url: http://homeassistant:8123
  client_token: ""
  allowed_clients: []
  voice: sirius
  model: grok-voice-latest
  idle_timeout_s: 10
  max_session_s: 600
  local_vad_barge_in: true
  eq_enabled: true
  vad_gate: true
  echo_cancel: true
  input_gain_db: 0
  debug_dump_s: 0
  log_level: info
schema:
  xai_api_key: password
  ha_token: password
  ha_url: url
  client_token: password
  allowed_clients:
    - str
  voice: str
  model: str
  idle_timeout_s: int(3,600)
  max_session_s: int(10,3600)
  local_vad_barge_in: bool
  eq_enabled: bool
  output_rate: list(48000|24000|16000)?
  vad_gate: bool
  echo_cancel: bool
  barge_threshold: float(0.3,0.99)?
  barge_min_speech_ms: int(96,1500)?
  barge_margin_db: float(0,30)?
  barge_frac: float(0.05,1)?
  echo_tail_ms: int(0,2000)?
  input_gain_db: float(-20,40)
  debug_dump_s: int(0,60)
  log_level: list(debug|info|warning|error)
  instructions: str?
  barge_onset_extra_db: float(0,20)?
  web_search: bool?
  x_search: bool?
  hidden_tool_pattern: str?
  timezone: str?
  barge_onset_s: float(0,5)?
  tool_reply_protect_s: float(0,30)?
  barge_hv_from_db: float(-30,0)?
  barge_hv_full_db: float(-30,6)?
  barge_hv_frac: float(0.05,1)?
  barge_hv_margin_db: float(0,30)?
  eq_preamp_db: float(-12,12)?
  eq_ceiling_db: float(-12,0)?
  barge_frac_floor: float(0,1)?
  barge_strict_until_s: float(0,30)?
  arbitration_window_ms: int(0,2000)?
  playback_volume_cap: float(0,1)?
  memory_enabled: bool?
  memory_dir: str?
  memory_retention_days: int(1,3650)?
  memory_model: str?
