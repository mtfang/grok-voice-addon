# No `image:` key -> Supervisor builds this add-on locally from the Dockerfile.
name: Grok Voice Live
version: "0.2.0"
slug: grok_voice_live
description: Live speech-to-speech Grok (xAI realtime) bridge for Satellite1 devices, with Home Assistant MCP tools
url: https://github.com/mtfang/grok-voice-addon
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  10700/tcp: 10700
ports_description:
  10700/tcp: Grok live stream (Satellite1 grok_stream component)
options:
  xai_api_key: ""
  ha_token: ""
  ha_url: http://homeassistant:8123
  client_token: ""
  allowed_clients: []
  voice: sirius
  model: grok-voice-latest
  idle_timeout_s: 8
  max_session_s: 120
  local_vad_barge_in: true
  eq_enabled: true
  log_level: info
schema:
  xai_api_key: password
  ha_token: password
  ha_url: url
  client_token: password
  allowed_clients:
    - str
  voice: str
  model: str
  idle_timeout_s: int(3,60)
  max_session_s: int(10,600)
  local_vad_barge_in: bool
  eq_enabled: bool
  output_rate: list(48000|24000|16000)?
  log_level: list(debug|info|warning|error)
  instructions: str?
